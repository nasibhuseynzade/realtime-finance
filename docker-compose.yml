name: realtime-finance

# Log rotation for every container, so the disk never fills up
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. Apache Kafka in KRaft mode (no ZooKeeper since Kafka 4.0)
  kafka:
    image: confluentinc/cp-kafka:8.2.5
    container_name: kafka
    environment:
      CLUSTER_ID: flbD2EIVSX2F1F78_sE55g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # 2. InfluxDB 1.x (time-series database, InfluxQL)
  influxdb:
    image: influxdb:1.12
    container_name: influxdb
    environment:
      INFLUXDB_DB: finance_data
      INFLUXDB_REPORTING_DISABLED: "true"
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: unless-stopped
    logging: *default-logging

  # 3. Grafana (data source and dashboard are provisioned from the repo)
  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    depends_on:
      - influxdb
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: https://dashboard.nasib.tech
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    logging: *default-logging

  # 4. Caddy (HTTPS + reverse proxy). The only service open to the internet.
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana
    restart: unless-stopped
    logging: *default-logging

  # 5. Data producer (Python)
  producer:
    build: .
    container_name: finance_producer
    command: python -u producer.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # 6. Data consumer (Python)
  consumer:
    build: .
    container_name: finance_consumer
    command: python -u consumer.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP_ID: influx-writer
      INFLUX_HOST: influxdb
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  kafka_data:
  influxdb_data:
  grafana_data:
  caddy_data:
  caddy_config:
