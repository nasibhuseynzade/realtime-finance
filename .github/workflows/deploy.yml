name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to the server and deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GRAFANA_ADMIN_PASSWORD
          script: |
            set -e
            cd ~/realtime-finance
            git fetch --all
            git reset --hard origin/main
            git clean -fd
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD" > .env
            # --build: rebuild producer/consumer so code changes actually go live
            docker compose up -d --build --remove-orphans
            docker image prune -f
